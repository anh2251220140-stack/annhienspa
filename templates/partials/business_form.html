<form class="admin-service-form admin-ops-form" enctype="multipart/form-data" method="post">
{% csrf_token %}<div class="admin-service-modal-scroll"><div class="admin-service-form-grid">{% for field in form %}{% if field.name == 'services' %}<div class="admin-ops-full"><span>{{ field.label }}</span>{{ field }}{{ field.errors }}</div>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}{{ field }}{{ field.errors }}</label>{% endif %}{% endfor %}</div>
<p class="admin-service-error" data-error role="alert" hidden></p></div><div class="admin-dialog-actions"><button type="button" class="admin-button" data-close>Hủy</button><button type="submit" class="admin-button admin-button-primary">Lưu thay đổi</button></div></form>
