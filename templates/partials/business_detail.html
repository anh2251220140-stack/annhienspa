<div class="admin-service-modal-scroll">
{% for group in groups %}<section class="admin-ops-detail-section"><h4><span data-live-icon="{{ group.icon }}"></span>{{ group.title }}</h4><dl class="admin-profile-facts admin-ops-facts">{% for item in group.fields %}<div><dt>{{ item.bound.label }}</dt><dd>{% if item.preview %}<img class="live-image-preview" src="{{ item.preview }}" alt="{{ item.bound.label }}">{% elif item.file and item.value %}<img class="live-image-preview" src="{{ item.value.url }}" alt="{{ item.bound.label }}">{% else %}{{ item.value|default_if_none:''|default:'Chưa cập nhật'|linebreaksbr }}{% endif %}</dd></div>{% endfor %}</dl></section>{% endfor %}
</div><div class="admin-dialog-actions"><button class="admin-button" type="button" data-close>Đóng</button></div>
