# Local hybrid deployment; old MySQL containers and volumes are not managed here.
# MySQL-container deployment remains possible with a separately approved override.
name: annhien-spa-windows

services:
  web:
    build: .
    restart: unless-stopped
    # Preserve Windows Django/AI/PayOS/email values without baking .env into image.
    env_file:
      - path: .env
        required: true
    environment:
      MYSQL_DATABASE: annhien_spa
      MYSQL_USER: annhien_django
      # MYSQL_HOST is inherited from .env for the existing RAG identity.
      DOCKER_MYSQL_CONNECT_HOST: ${DOCKER_MYSQL_CONNECT_HOST:-host.docker.internal}
      MYSQL_PORT: "3306"
      DJANGO_DOCKER_MEDIA_ENABLED: "true"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ./media
        target: /app/media
        bind:
          create_host_path: false
      - type: bind
        source: ./.rag-index
        target: /app/.rag-index
        bind:
          create_host_path: false
      - docker_static:/app/staticfiles

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-18081}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - docker_static:/app/staticfiles:ro
    # No media mount: every media request must pass Django permissions.

volumes:
  docker_static:
